name: Scheduled Rebuild

on:
  schedule:
    # 每7天（每周日 UTC 00:00）自动触发重新构建部署
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        run: curl -fsS -d "" "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"
